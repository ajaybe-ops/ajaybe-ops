name: Refresh profile assets

on:
  schedule:
    # Every six hours, off the hour to be kind to GitHub's scheduler.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/github-assets.mjs'
      - 'scripts/lib/svg.mjs'
      - '.github/workflows/profile-assets.yml'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # PROFILE_TOKEN is a fine-grained/classic PAT with read:user. Without it
      # the REST cards still update and the existing calendar is preserved.
      - name: Generate stats, languages and contributions
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: node scripts/github-assets.mjs --out assets

      - name: Commit refreshed assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/metrics.svg assets/languages.svg assets/contributions.svg
          if git diff --cached --quiet; then
            echo 'Assets are already current.'
            exit 0
          fi
          git commit -m 'chore: refresh profile stats [skip ci]'
          git push
