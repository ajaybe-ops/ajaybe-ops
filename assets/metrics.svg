<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-labelledby="t d">
  <title id="t">GitHub statistics</title>
  <desc id="d">36 public repositories, 27 stars, 4 followers.</desc>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#26ff9c" opacity="0.05" />
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#0a2417" />
      <stop offset="70%" stop-color="#030705" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace; }
      .hdr { font-size: 12px; letter-spacing: 2.6px; fill: #26ff9c; }
      .sub { font-size: 10px; letter-spacing: 1.5px; fill: #6fbf97; }
      .big { font-size: 40px; font-weight: 700; fill: #8dffc6; font-variant-numeric: tabular-nums; }
      .label { font-size: 10px; letter-spacing: 2px; fill: #6fbf97; }
      .value { font-size: 13px; fill: #c8ffe3; }
      .muted { fill: #6fbf97; }
      
    </style>
    
  </defs>
  <rect width="880" height="230" rx="6" fill="url(#vignette)" />
  <rect width="880" height="230" rx="6" fill="url(#scan)" />
  <rect x="0.5" y="0.5" width="879" height="229" rx="6" fill="none" stroke="#113a2a" />
  
  <circle cx="31" cy="26" r="3" fill="#0d6b45" />
  <circle cx="42" cy="26" r="3" fill="#0d6b45" opacity="0.7" />
  <circle cx="53" cy="26" r="3" fill="#0d6b45" opacity="0.4" />
  <text x="70" y="30" class="mono hdr">$ stats --live</text>
  <text x="852" y="30" class="mono sub" text-anchor="end">UPDATED 2026-11-26</text>
  <line x1="28" y1="40" x2="852" y2="40" stroke="#0c271d" />
  <g>
    <rect x="28.0" y="74" width="194.0" height="118" rx="4" fill="#071410" stroke="#0c271d" />
    <rect x="28.0" y="74" width="2" height="118" fill="#0d6b45" />
    <text x="44.0" y="100" class="mono label">REPOSITORIES</text>
    <text x="44.0" y="148" class="mono big" filter="url(#glow)">36</text>
    <text x="44.0" y="174" class="mono" font-size="9" letter-spacing="1" fill="#6fbf97">public repositories</text>
  </g>
  <g>
    <rect x="238.0" y="74" width="194.0" height="118" rx="4" fill="#071410" stroke="#0c271d" />
    <rect x="238.0" y="74" width="2" height="118" fill="#0d6b45" />
    <text x="254.0" y="100" class="mono label">STARS EARNED</text>
    <text x="254.0" y="148" class="mono big" filter="url(#glow)">27</text>
    <text x="254.0" y="174" class="mono" font-size="9" letter-spacing="1" fill="#6fbf97">across public repos</text>
  </g>
  <g>
    <rect x="448.0" y="74" width="194.0" height="118" rx="4" fill="#071410" stroke="#0c271d" />
    <rect x="448.0" y="74" width="2" height="118" fill="#0d6b45" />
    <text x="464.0" y="100" class="mono label">FOLLOWERS</text>
    <text x="464.0" y="148" class="mono big" filter="url(#glow)">4</text>
    <text x="464.0" y="174" class="mono" font-size="9" letter-spacing="1" fill="#6fbf97">watching the signal</text>
  </g>
  <g>
    <rect x="658.0" y="74" width="194.0" height="118" rx="4" fill="#071410" stroke="#0c271d" />
    <rect x="658.0" y="74" width="2" height="118" fill="#0d6b45" />
    <text x="674.0" y="100" class="mono label">CONTRIBUTIONS</text>
    <text x="674.0" y="148" class="mono big" filter="url(#glow)">296</text>
    <text x="674.0" y="174" class="mono" font-size="9" letter-spacing="1" fill="#6fbf97">last 365 days</text>
  </g>
  <text x="28" y="210" class="mono" font-size="9" letter-spacing="1.4" fill="#6fbf97">MEMBER SINCE 2023 · SOURCE: GITHUB REST API</text>
  <text x="852" y="210" class="mono" font-size="9" letter-spacing="1.4" fill="#0d6b45" text-anchor="end">@ajaybe-ops</text>
</svg>
