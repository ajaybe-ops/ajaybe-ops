<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">ajaybe-ops — Matrix profile</title>
  <desc id="d">Animated terminal banner: a glowing green handle over falling digital rain.</desc>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#26ff9c" opacity="0.05" />
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#0a2417" />
      <stop offset="70%" stop-color="#030705" />
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace; }
      .hdr { font-size: 12px; letter-spacing: 2.6px; fill: #26ff9c; }
      .sub { font-size: 10px; letter-spacing: 1.5px; fill: #6fbf97; }
      .big { font-size: 40px; font-weight: 700; fill: #8dffc6; font-variant-numeric: tabular-nums; }
      .label { font-size: 10px; letter-spacing: 2px; fill: #6fbf97; }
      .value { font-size: 13px; fill: #c8ffe3; }
      .muted { fill: #6fbf97; }
      
      .cursor { animation: blink 1.15s steps(1) infinite; }
      .sweep { animation: sweep 9s linear infinite; }
      @keyframes blink { 0%, 55% { opacity: .85 } 56%, 100% { opacity: .08 } }
      @keyframes sweep { 0% { transform: translateY(20px) } 100% { transform: translateY(280px) } }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .sweep { animation: none; }
      }
    </style>
    
  </defs>
  <rect width="1200" height="320" rx="6" fill="url(#vignette)" />
  <rect width="1200" height="320" rx="6" fill="url(#scan)" />
  <rect x="0.5" y="0.5" width="1199" height="319" rx="6" fill="none" stroke="#113a2a" />
  
