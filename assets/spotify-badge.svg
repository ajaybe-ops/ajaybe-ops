<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-labelledby="npTitle npDesc">
  <title id="npTitle">SIGNAL LOST</title>
  <desc id="npDesc">Spotify now-playing card: the feed is unavailable.</desc>

  <defs>
    <clipPath id="artClip"><rect x="16" y="24" width="112" height="112" rx="4" /></clipPath>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f8f3a" />
      <stop offset="60%" stop-color="#1d6b35" />
      <stop offset="100%" stop-color="#b6ffc4" />
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#39ff14" opacity="0.045" />
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace; }
      .label { font-size: 10px; letter-spacing: 2px; fill: #1d6b35; }
      .title { font-size: 20px; font-weight: 700; fill: #7fdc9a; letter-spacing: 0.4px; }
      .sub { font-size: 12px; fill: #5f9c72; }
      .time { font-size: 10px; fill: #5f9c72; letter-spacing: 0.6px; }
      .pulse { animation: pulse 1.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.25 } }
      .eq rect { animation: bounce 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      .eq rect:nth-child(2) { animation-delay: .18s }
      .eq rect:nth-child(3) { animation-delay: .36s }
      .eq rect:nth-child(4) { animation-delay: .54s }
      .eq rect:nth-child(5) { animation-delay: .72s }
      @keyframes bounce { 0%,100% { transform: scaleY(.22) } 50% { transform: scaleY(1) } }
    </style>
  </defs>

  <rect width="640" height="160" rx="6" fill="#040804" />
  <rect width="640" height="160" rx="6" fill="url(#scanlines)" />
  <rect x="0.5" y="0.5" width="639" height="159" rx="6" fill="none" stroke="#1f4d2c" stroke-width="1" />

  <!-- album art -->
  <rect x="16" y="24" width="112" height="112" rx="4" fill="#07120a" stroke="#1f4d2c" />
  <g>
    <rect x="16" y="24" width="112" height="112" rx="4" fill="#06100a" />
    <path d="M16 24 L128 136 M128 24 L16 136" stroke="#123a1f" stroke-width="1" />
    <text x="72" y="84" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#2f7f49">IDLE</text>
    <text x="72" y="100" text-anchor="middle" class="mono" font-size="8" letter-spacing="1.5" fill="#1d5a33">NO DATA</text>
  </g>

  <!-- text block -->
  <text x="148" y="40" class="mono label">SPOTIFY // IDLE</text>
  <circle cx="612" cy="36" r="4" fill="#1d6b35" opacity="0.35" />
  <text x="148" y="72" class="mono title" filter="url(#glow)">SIGNAL LOST</text>
  <text x="148" y="92" class="mono sub">Spotify is not configured on this deployment.</text>
  <text x="148" y="108" class="mono sub" opacity="0.75">STATUS: IDLE</text>

  <!-- equalizer -->
  <g class="eq" transform="translate(578 58)">
    <rect x="0" y="0" width="5" height="22" rx="1.5" fill="#1d6b35" opacity="0.25" /><rect x="9" y="0" width="5" height="22" rx="1.5" fill="#1d6b35" opacity="0.25" /><rect x="18" y="0" width="5" height="22" rx="1.5" fill="#1d6b35" opacity="0.25" /><rect x="27" y="0" width="5" height="22" rx="1.5" fill="#1d6b35" opacity="0.25" /><rect x="36" y="0" width="5" height="22" rx="1.5" fill="#1d6b35" opacity="0.25" />
  </g>

  <!-- progress -->
  <rect x="148" y="124" width="400" height="4" rx="2" fill="#102616" />
  <rect x="148" y="124" width="0" height="4" rx="2" fill="url(#barFill)" />
  <text x="148" y="146" class="mono time">--:--</text>
  <text x="548" y="146" class="mono time" text-anchor="end">--:--</text>

  <a href="https://open.spotify.com" target="_blank" rel="noopener noreferrer">
    <text x="624" y="146" class="mono time" text-anchor="end" fill="#39ff14">SPOTIFY &#8599;</text>
  </a>
</svg>